<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Source de trame de code : deux résidences au bord du lac, reflets dans l'eau. -->
  <defs>
    <pattern id="win" x="160" y="360" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect x="14" y="30" width="72" height="56" fill="#262626"/>
    </pattern>
    <pattern id="slab" x="0" y="360" width="1600" height="100" patternUnits="userSpaceOnUse"><rect width="1600" height="20" fill="#3A3A3A"/></pattern>
    <pattern id="rail" x="0" y="360" width="1600" height="100" patternUnits="userSpaceOnUse"><rect y="66" width="1600" height="34" fill="#C4C4C4" opacity=".82"/></pattern>
    <pattern id="water" x="0" y="800" width="1600" height="26" patternUnits="userSpaceOnUse"><rect width="1600" height="10" fill="#B4B4B4"/></pattern>
    <pattern id="refl" x="0" y="800" width="64" height="26" patternUnits="userSpaceOnUse"><rect width="40" height="12" fill="#6A6A6A"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <!-- résidence A -->
  <rect x="250" y="340" width="420" height="20" fill="#3A3A3A"/>
  <rect x="270" y="260" width="380" height="80" fill="#A0A0A0"/>
  <rect x="240" y="250" width="440" height="16" fill="#3A3A3A"/>
  <rect x="160" y="360" width="600" height="400" fill="#A0A0A0"/>
  <rect x="160" y="360" width="600" height="400" fill="url(#win)"/>
  <rect x="130" y="360" width="660" height="400" fill="url(#rail)"/>
  <rect x="130" y="360" width="660" height="400" fill="url(#slab)"/>
  <!-- résidence B -->
  <rect x="960" y="380" width="420" height="80" fill="#A0A0A0"/>
  <rect x="940" y="370" width="460" height="16" fill="#3A3A3A"/>
  <rect x="880" y="460" width="580" height="300" fill="#A0A0A0"/>
  <rect x="880" y="460" width="580" height="300" fill="url(#win)"/>
  <rect x="850" y="460" width="640" height="300" fill="url(#rail)"/>
  <rect x="850" y="460" width="640" height="300" fill="url(#slab)"/>
  <!-- arbre -->
  <rect x="64" y="520" width="24" height="250" fill="#4A4A4A"/>
  <g fill="#6E6E6E"><circle cx="78" cy="430" r="110"/><circle cx="150" cy="500" r="74"/><circle cx="20" cy="520" r="70"/><circle cx="1540" cy="690" r="70"/></g>
  <!-- rive et lac -->
  <rect y="760" width="1600" height="40" fill="#4A4A4A"/>
  <rect y="800" width="1600" height="200" fill="url(#water)"/>
  <rect x="160" y="800" width="600" height="150" fill="url(#refl)"/>
  <rect x="880" y="800" width="580" height="110" fill="url(#refl)"/>
</svg>
